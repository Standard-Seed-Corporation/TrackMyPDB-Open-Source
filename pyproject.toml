[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackmypdb"
dynamic = ["version"]
description = "Extract ligands from the PDB structures of UniProt proteins and rank them by fingerprint similarity."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Suliman Sharif" },
  { name = "Anu Gamage" },
  { name = "Kalana Kotawalagedara" },
  { name = "Sakeer MR" },
  { name = "Damilola Bodun" },
]
keywords = ["cheminformatics", "protein data bank", "ligands", "molecular similarity",
            "drug discovery", "uniprot", "rdkit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "numpy>=1.24",
  "rdkit>=2023.9.1",
  "pillow>=10.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.45", "plotly>=5.15", "python-dotenv>=1.0"]
agent = ["mcp>=1.2", "anthropic>=0.39", "python-dotenv>=1.0"]
test = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
trackmypdb = "trackmypdb.cli:main"

[project.urls]
"Web app" = "https://trackmypdbsscai.streamlit.app/"
# TODO: add "Source" and "Issues" URLs of the public GitHub repository.

[tool.setuptools]
packages = ["trackmypdb"]

[tool.setuptools.dynamic]
version = { attr = "trackmypdb.__version__" }

[tool.setuptools.package-data]
trackmypdb = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: tests that call the live RCSB/PDBe/UniProt APIs (run with --run-network)"]
